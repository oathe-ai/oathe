<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 856" font-family="Menlo, 'SF Mono', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="13">
  <style>text { white-space: pre; }</style>
  <defs>
    <clipPath id="winTop"><rect x="0" y="0" width="900" height="468" rx="10"/></clipPath>
    <clipPath id="winBot"><rect x="0" y="492" width="900" height="364" rx="10"/></clipPath>
  </defs>

  <!-- ===== Top window: Claude Code ===== -->
  <g clip-path="url(#winTop)">
    <rect x="0" y="0" width="900" height="468" fill="#111214"/>
    <rect x="0" y="0" width="900" height="32" fill="#1b1c20"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="467" rx="10" fill="none" stroke="#2a2c33"/>
  <circle cx="22" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="16" r="6" fill="#febc2e"/>
  <circle cx="62" cy="16" r="6" fill="#28c840"/>
  <text x="450" y="21" text-anchor="middle" fill="#8b8f98">checkout-service — claude</text>

  <!-- Claude Code pixel mascot -->
  <g fill="#d97757">
    <rect x="24" y="48" width="40" height="32"/>
    <rect x="26" y="80" width="5" height="8"/>
    <rect x="37" y="80" width="5" height="8"/>
    <rect x="48" y="80" width="5" height="8"/>
    <rect x="59" y="80" width="5" height="8"/>
  </g>
  <rect x="36" y="56" width="4" height="12" fill="#2a1a12"/>
  <rect x="50" y="56" width="4" height="12" fill="#2a1a12"/>

  <g xml:space="preserve" fill="#d6d8dd">
    <text x="76" y="60"><tspan font-weight="bold" fill="#e8eaef">Claude Code</tspan><tspan fill="#8b8f98"> v2.1.239</tspan></text>
    <text x="76" y="80" fill="#8b8f98">Fable 5 with xhigh effort · Claude Max</text>
    <text x="76" y="100" fill="#8b8f98">~/checkout-service</text>

    <text x="24" y="136"><tspan fill="#8b8f98">&gt; </tspan><tspan fill="#e8eaef">Customers get double-charged on checkout retries — find and fix it.</tspan></text>

    <text x="24" y="172"><tspan fill="#4ec97a">● </tspan><tspan>capturePayment omits the order's idempotency key, so a retried request opens a</tspan></text>
    <text x="24" y="192"><tspan>  second charge. I'll thread it through the gateway call.</tspan></text>

    <text x="24" y="220"><tspan fill="#4ec97a">● </tspan><tspan font-weight="bold" fill="#e8eaef">Read</tspan><tspan fill="#6cb6ff">(src/capturePayment.ts, gateway.ts)</tspan></text>
    <text x="24" y="240" fill="#8b8f98">  ⎿ Read 2 files</text>

    <text x="24" y="268"><tspan fill="#4ec97a">● </tspan><tspan font-weight="bold" fill="#e8eaef">Update</tspan><tspan fill="#6cb6ff">(src/capturePayment.ts)</tspan></text>
    <text x="24" y="288" fill="#8b8f98">  ⎿ Added 1 line, removed 1 line</text>

    <text x="24" y="312" fill="#8b8f98">      22      const res = await gateway.charge({</text>
    <rect x="12" y="320" width="876" height="20" fill="#3b1517"/>
    <text x="24" y="334"><tspan fill="#8b8f98">      23 </tspan><tspan fill="#f47067">-      source: order.token,</tspan></text>
    <rect x="12" y="340" width="876" height="20" fill="#13351d"/>
    <text x="24" y="354"><tspan fill="#8b8f98">      23 </tspan><tspan fill="#7ee787">+      source: order.token, idempotencyKey: order.idempotencyKey,</tspan></text>
    <text x="24" y="374" fill="#8b8f98">      24      })</text>

    <text x="24" y="402"><tspan fill="#4ec97a">● </tspan><tspan font-weight="bold" fill="#e8eaef">Bash</tspan><tspan fill="#6cb6ff">(node --test test/payment.idempotency.test.js)</tspan></text>
    <text x="24" y="422" fill="#8b8f98">  ⎿ Running verification…</text>

    <text x="24" y="450"><tspan fill="#e5a44c">⚠ Claude usage limit reached · resets 1:00 AM · run /upgrade to raise your limit</tspan></text>
  </g>

  <!-- ===== Bottom window: Codex ===== -->
  <g clip-path="url(#winBot)">
    <rect x="0" y="492" width="900" height="364" fill="#111214"/>
    <rect x="0" y="492" width="900" height="32" fill="#1b1c20"/>
  </g>
  <rect x="0.5" y="492.5" width="899" height="363" rx="10" fill="none" stroke="#2a2c33"/>
  <circle cx="22" cy="508" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="508" r="6" fill="#febc2e"/>
  <circle cx="62" cy="508" r="6" fill="#28c840"/>
  <text x="450" y="513" text-anchor="middle" fill="#8b8f98">checkout-service — codex</text>

  <g xml:space="preserve" fill="#d6d8dd">
    <text x="24" y="552" fill="#8b8f98">(base) dev@macbook-pro checkout-service % <tspan font-weight="bold" fill="#e8eaef">codex</tspan></text>

    <rect x="20" y="564" width="420" height="52" rx="6" fill="none" stroke="#3a3f4b"/>
    <text x="34" y="586"><tspan font-weight="bold" fill="#e8eaef">&gt;_ OpenAI Codex</tspan><tspan fill="#8b8f98">   model: gpt-5.6</tspan></text>
    <text x="34" y="606" fill="#8b8f98">   directory: ~/checkout-service</text>

    <text x="24" y="642"><tspan fill="#4ec97a">● </tspan><tspan font-weight="bold" fill="#e8eaef">oathe</tspan><tspan fill="#8b8f98"> · unfinished work found — </tspan><tspan fill="#e8eaef">handoff from claude-code</tspan></text>
    <text x="24" y="668"><tspan fill="#8b8f98">    work      </tspan><tspan>prevent duplicate charge on checkout retry</tspan></text>
    <text x="24" y="688"><tspan fill="#8b8f98">    progress  </tspan><tspan>idempotency guard implemented in capturePayment.ts</tspan></text>
    <text x="24" y="708"><tspan fill="#8b8f98">    effects   </tspan><tspan fill="#6cb6ff">charge ch_4821</tspan><tspan> already recorded — </tspan><tspan fill="#4ec97a">will not repeat</tspan></text>
    <text x="24" y="728"><tspan fill="#8b8f98">    verify    </tspan><tspan fill="#6cb6ff">payment-idempotency</tspan><tspan> contract</tspan></text>
    <text x="24" y="748"><tspan fill="#8b8f98">    next      </tspan><tspan>run verification</tspan></text>

    <rect x="238" y="768" width="44" height="22" rx="5" fill="#1d3b28" stroke="#2ea55f"/>
    <text x="24" y="783"><tspan fill="#4ec97a">❯ </tspan><tspan fill="#e8eaef">Resume this work?</tspan></text>
    <text x="248" y="783" fill="#7ee787">Yes</text>
    <text x="296" y="783" fill="#8b8f98">No</text>

    <text x="24" y="815"><tspan fill="#4ec97a">● </tspan><tspan>Resuming open oathe claim</tspan></text>
    <text x="24" y="839"><tspan fill="#4ec97a">● </tspan><tspan>Running <tspan fill="#6cb6ff">payment-idempotency</tspan> contract…</tspan></text>
  </g>
</svg>
