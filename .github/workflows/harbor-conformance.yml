name: Harbor conformance

# Our converters promise to emit what a Harbor converter could also emit. Nightly, this lane
# installs the pinned Harbor, drives its own converters on every corpus fixture, and compares
# the structure against the reviewed baseline in harbor-conformance.lock.json. It never blocks
# a PR — a divergence is a finding, not proof of breakage — but it fails LOUD: a red scheduled
# run and one open issue naming the fixture, the field, and both sides. Re-pin after review:
# npm run harbor-conformance-lock with harbor importable from python3 (see CONTRIBUTING).

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harbor-conformance
  cancel-in-progress: true

jobs:
  conformance:
    name: Drive Harbor's converters on the corpus and compare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Read the pin
        id: pin
        run: |
          echo "harbor=$(node -p "require('./harbor-conformance.lock.json').harbor.version")" >> "$GITHUB_OUTPUT"
          echo "python=$(node -p "require('./harbor-conformance.lock.json').harbor.python.split('.').slice(0, 2).join('.')")" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.pin.outputs.python }}
      - name: Install the pinned Harbor
        run: python3 -m pip install --disable-pip-version-check "harbor==${{ steps.pin.outputs.harbor }}"
      - name: Install from the lockfile without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Compare Harbor's converters against ours on every fixture
        run: npm run harbor-conformance | tee harbor-conformance-report.txt
      - name: Open or update the divergence issue (fail loud)
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "harbor conformance divergence"
          REPORT: harbor-conformance-report.txt
        run: |
          body="$(printf '%s\n\n```\n%s\n```\n\nRun: %s' "Recorded by the scheduled monitor on $(date -u +%Y-%m-%dT%H:%M:%SZ)." "$(cat "$REPORT")" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)"
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$TITLE" --label drift --body "$body"; fi
