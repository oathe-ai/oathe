name: Release canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-canary
  cancel-in-progress: false

jobs:
  package:
    name: Build non-publishing canary
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - name: Install from the lockfile without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Re-run tests in the release boundary
        run: npm test
      - name: Build the canary tarball without publishing
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          cd dist
          sha256sum *.tgz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload the short-lived canary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oathe-ci-canary
          path: dist/
          if-no-files-found: error
          retention-days: 1
