name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.x
          - 24.x
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install from the lockfile without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run the suite against real Postgres
        run: npm test

  package:
    name: Package dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - name: Install from the lockfile without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify the npm package contents without publishing
        run: npm run pack:dry-run

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - name: Lint — the seam-hygiene gate (pinned npx, no devDependencies)
        run: npm run lint

  required:
    name: required
    if: ${{ always() }}
    needs:
      - test
      - package
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI lane to pass
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          test "$PACKAGE_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$LINT_RESULT" = "success"
