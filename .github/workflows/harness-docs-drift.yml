name: Harness docs drift

# The docs a harness adapter was written against changed. This never blocks a PR — a page
# changing is a signal, not proof of breakage — but it fails LOUD: a red scheduled run and one
# open issue per harness naming the page and the adapter to re-verify. Re-pin after review:
# npm run pull-harness-docs && npm run harness-docs-lock (see CONTRIBUTING).

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-docs-drift
  cancel-in-progress: true

jobs:
  docs:
    name: Re-pull every pinned page and compare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Install from the lockfile without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Compare the live pages against harness-docs.lock.json
        run: npm run harness-docs-drift | tee docs-drift-report.txt
      - name: Open or update the drift issue (fail loud)
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "harness docs drift"
          REPORT: docs-drift-report.txt
        run: |
          body="$(printf '%s\n\n```\n%s\n```\n\nRun: %s' "Recorded by the scheduled monitor on $(date -u +%Y-%m-%dT%H:%M:%SZ)." "$(cat "$REPORT")" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)"
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$TITLE" --label drift --body "$body"; fi
